<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MRX4 Team Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: MRX4 navy masthead with the reverse lockup, then a month-by-month calendar where each tournament appears once with its MRX4 players; players, circuits and news views. */
:root{
  --bg:#F2EDE4; --surface:#FBF8F2; --ink:#15171C; --muted:#5B6275; --line:#D9D2C4; --soft:#E8E1D4;
  --mast:#0D1B3E; --mast-ink:#F2EDE4; --star:#60DC21; --star-ink:#2E7A08;
  --warn:#B4441B; --warn-bg:#F7DFD3;
  --c-premier:#2E8F0A; --c-fip:#2F63D0; --c-hexagon:#C77C00; --c-ppl:#C93A2E; --c-appt-asia:#0E8C7F; --c-appt-america:#7247C9; --c-ipl:#B2306E;
  --on-bar:#FFFFFF;
  --f-display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --wk:30px; --name-w:150px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1430; --surface:#101D40; --ink:#F2EDE4; --muted:#A3A9BC; --line:#253463; --soft:#16244C;
  --mast:#060D22; --mast-ink:#F2EDE4; --star:#60DC21; --star-ink:#7FEA48;
  --warn:#FF9A73; --warn-bg:#3A1D1A;
  --c-premier:#60DC21; --c-fip:#6E9CFF; --c-hexagon:#F2B544; --c-ppl:#FF7A6E; --c-appt-asia:#3FD0C0; --c-appt-america:#A88BFF; --c-ipl:#F07AB2;
  --on-bar:#0D1B3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#101D40; --ink:#F2EDE4; --muted:#A3A9BC; --line:#253463; --soft:#16244C;
  --mast:#060D22; --mast-ink:#F2EDE4; --star:#60DC21; --star-ink:#7FEA48;
  --warn:#FF9A73; --warn-bg:#3A1D1A;
  --c-premier:#60DC21; --c-fip:#6E9CFF; --c-hexagon:#F2B544; --c-ppl:#FF7A6E; --c-appt-asia:#3FD0C0; --c-appt-america:#A88BFF; --c-ipl:#F07AB2;
  --on-bar:#0D1B3E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--star);outline-offset:2px}

/* masthead */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{position:relative;padding-block:22px 0;display:grid;gap:14px}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.mast{position:relative;overflow:hidden}
.lockup{height:62px;width:auto;display:block}
.smiley{position:absolute;right:max(-30px,calc(50% - 680px));top:-18px;height:150px;width:auto;opacity:.9;pointer-events:none;transform:rotate(-8deg)}
.brand h1{padding-bottom:2px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand .meta{margin-left:auto;margin-right:170px;font-family:var(--f-mono);font-size:12px;opacity:.75;text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mast-ink);opacity:.65;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--star)}
.tabs button:hover{opacity:1}

main .wrap{padding-block:24px 96px;display:grid;gap:22px}
.lede{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.lede p{margin:0;color:var(--muted);max-width:68ch}
h2{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.03em;margin:0;line-height:1}
h3{font-size:15px;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;background:var(--c);flex:none}
.sw.prov{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);outline:1px solid var(--c);outline-offset:-1px}

/* month calendar */
.monthbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.mnav{display:flex;align-items:center;gap:6px}
.mnav h2{min-width:8.5ch;text-align:center}
.arrow{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.arrow:disabled{opacity:.35;cursor:default}
.mstrip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.mstrip button{border:1px solid transparent;background:none;border-radius:4px;padding:5px 8px 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.mstrip button i{font-style:normal;width:5px;height:5px;border-radius:50%;background:var(--star-ink);visibility:hidden}
.mstrip button.has i{visibility:visible}
.mstrip button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.pfilter{display:flex;flex-wrap:wrap;gap:6px}
.pfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.pfilter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pfilter .toggle{border-style:dashed;color:var(--muted)}
.pfilter .toggle[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-style:solid;border-color:var(--line)}
.cal{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.dow span{padding:7px 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:auto;min-height:104px;border-top:1px solid var(--line);row-gap:4px;padding-bottom:6px}
.wk:first-of-type{border-top:0}
.day{grid-row:1/-1;border-left:1px solid var(--soft);padding:5px 8px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.day:first-child{border-left:0}
.day.out{color:var(--muted);opacity:.45;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.day.we{color:var(--muted)}
.seg{position:relative;z-index:1;margin:0 3px;border:0;border-left:4px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);text-align:left;padding:5px 8px 5px 7px;cursor:pointer;display:grid;gap:1px;min-width:0;line-height:1.25}
.seg b{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg span{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.seg.prov{background:var(--surface);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent);border-left-style:dashed}
.seg.prov b::after{content:" · provisional";font-weight:400;font-size:10.5px;color:var(--muted)}
.seg.none{background:transparent;border-left-width:2px}
.seg.none b{font-weight:500;color:var(--muted)}
.seg.cl{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;padding-left:8px}
.seg.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.seg:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.seg:focus-visible{outline-offset:1px}
.mlist{display:grid}
.mlist>h3{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.05em;padding-bottom:6px;border-bottom:2px solid var(--ink)}
@media (max-width:640px){.wk{min-height:84px}.day{padding:4px 5px;font-size:11px}.seg{padding:4px 5px;margin:0 2px}.seg b{font-size:11px}.seg span{display:none}.dow span{padding:6px 5px}}
/* pills & chips */
.pill{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.confirmed{color:var(--star-ink)}
.pill.provisional{color:var(--muted);border-style:dashed}
.pill.tbc{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* players */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-top{display:flex;align-items:baseline;gap:10px}
.card-top h3{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1}
.cc{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.evlist{list-style:none;margin:0;padding:0;display:grid}
.evlist li{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--soft);font-size:13.5px}
.evlist .dt{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.evlist .nm{display:flex;align-items:center;gap:7px;min-width:0}
.evlist .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnbox{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:8px 10px;border-radius:4px}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--star);color:#0D1B3E}

/* tournaments */
.ev{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1.1fr);gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.ev .dt{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.ev .title{display:grid;gap:4px;min-width:0}
.ev .title b{font-weight:700;font-size:15px}
.ev .where{font-size:13px;color:var(--muted)}
.ev .note{font-size:12.5px;color:var(--muted)}
.ev .who{display:grid;gap:6px;align-content:start}
.ev .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lineup{border:1px dashed var(--line);border-radius:4px;padding:8px 10px;font-size:13px}
.lineup summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lineup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:8px}
.lineup label{display:flex;gap:6px;align-items:center}
.lineup small{color:var(--muted)}
@media (max-width:760px){.ev{grid-template-columns:1fr}}

/* circuits */
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.mx th,.mx td{padding:9px 10px;border-bottom:1px solid var(--soft);text-align:center}
.mx th{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.mx th .sw{margin:0 auto 6px}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mx input{width:18px;height:18px;accent-color:var(--star-ink);cursor:pointer}
.tick{font-weight:700;color:var(--star-ink)}
.dash{color:var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.ccard{border-top:4px solid var(--c);background:var(--surface);padding:14px 16px;border-radius:0 0 6px 6px;display:grid;gap:8px;align-content:start}
.ccard p{margin:0;font-size:13.5px;color:var(--muted)}

/* news */
.news{display:grid;gap:0}
.news article{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.news time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.news h3{font-size:16px;font-weight:500;text-wrap:balance}
.news h3 a{text-decoration:none}
.news h3 a:hover{text-decoration:underline}
@media (max-width:560px){.news article{grid-template-columns:1fr}}

/* detail sheet */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:3px solid var(--c,var(--star));box-shadow:0 -10px 30px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:16px;display:grid;gap:8px}
.sheet .x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}

/* save bar */
.savebar{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--mast);color:var(--mast-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.savebar p{margin:0;font-size:13.5px;margin-right:auto}
.savebar .btn.ghost{color:var(--mast-ink);border-color:rgba(242,237,228,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:4px;font-size:13.5px;max-width:calc(100% - 32px)}
.editnote{font-size:13px;background:var(--soft);padding:8px 12px;border-radius:4px;margin:0}
@media (prefers-reduced-motion:no-preference){.bar{transition:filter .15s}.bar:hover{filter:brightness(1.08)}}
@media (max-width:560px){.lockup{height:48px}.smiley{height:96px;top:-10px;right:-24px;opacity:.5}.brand .meta{margin:0;text-align:left;width:100%}:root{--name-w:112px}}
</style>
</head>

function renderCalendar(){
  var MS=months();if(month>MS.length-1)month=MS.length-1;
  var M=MS[month],first=Date.UTC(M.y,M.m,1),last=Date.UTC(M.y,M.m+1,1)-DAY;
  var dw=(new Date(first).getUTCDay()+6)%7,gs=first-dw*DAY;
  var dwl=(new Date(last).getUTCDay()+6)%7,ge=last+(6-dwl)*DAY;
  var evs=dated().filter(function(e){return inMonth(e,M)&&shown(e)});
  var weeks="";
  for(var ws=gs;ws<=ge;ws+=7*DAY){
    var we=ws+6*DAY,cells="";
    for(var i=0;i<7;i++){var d=ws+i*DAY,dd=new Date(d);cells+='<div class="day'+(dd.getUTCMonth()!==M.m?" out":"")+(i>4?" we":"")+'" style="grid-column:'+(i+1)+'">'+dd.getUTCDate()+"</div>"}
    var segs=evs.filter(function(e){return t(e.start)<=we&&t(e.end||e.start)>=ws});
    var lanes=[],out="";
    segs.forEach(function(e){
      var s=Math.max(t(e.start),ws),en=Math.min(t(e.end||e.start),we);
      var c0=Math.round((s-ws)/DAY)+1,c1=Math.round((en-ws)/DAY)+2;
      var lane=0;while(lanes[lane]&&lanes[lane]>=c0)lane++;lanes[lane]=c1-1;
      var who=whoAt(e);
      var cls=(e.status!=="confirmed"?" prov":"")+(who.length?"":" none")+(t(e.start)<ws?" cl":"")+(t(e.end||e.start)>we?" cr":"");
      out+='<button class="seg'+cls+'" style="--c:'+cvar(e.circuit)+';grid-column:'+c0+"/"+c1+";grid-row:"+(lane+2)+'" data-ev="'+esc(e.id)+'" title="'+esc(e.name+" · "+range(e))+'"><b>'+esc(e.name)+"</b><span>"+(who.length?esc(who.map(short).join(" · ")):"No MRX4 players yet")+"</span></button>";
    });
    weeks+='<div class="wk" style="grid-template-rows:26px'+(lanes.length?" repeat("+lanes.length+",auto)":"")+' 1fr">'+cells+out+"</div>";
  }
  var strip='<div class="mstrip" aria-label="Months">'+MS.map(function(X,i){var n=dated().filter(function(e){return inMonth(e,X)&&shown(e)}).length;return'<button data-m="'+i+'"'+(i===month?' aria-current="true"':"")+(n?' class="has"':"")+">"+MON[X.m]+(X.m===0||i===0?" "+String(X.y).slice(2):"")+"<i></i></button>"}).join("")+"</div>";
  var pf='<div class="pfilter" role="group" aria-label="Filter by player"><button data-pf="all" aria-pressed="'+(pfilter==="all")+'">All players</button>'+S.players.map(function(p){return'<button data-pf="'+esc(p.id)+'" aria-pressed="'+(pfilter===p.id)+'">'+esc(p.name)+"</button>"}).join("")+'<button class="toggle" data-all="1" aria-pressed="'+showAll+'">'+(showAll?"Showing all FIP events":"Show all FIP events")+"</button></div>";
  var tbc=S.events.filter(function(e){return!e.start&&(whoAt(e).length||showAll)});
  view.innerHTML='<div class="monthbar"><div class="mnav"><button class="arrow" data-step="-1" aria-label="Previous month"'+(month===0?" disabled":"")+'>‹</button><h2>'+MONL[M.m]+" "+M.y+'</h2><button class="arrow" data-step="1" aria-label="Next month"'+(month===MS.length-1?" disabled":"")+">›</button></div>"+strip+"</div>"+pf+legend()+
  '<div class="cal"><div class="dow">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return"<span>"+d+"</span>"}).join("")+"</div>"+weeks+"</div>"+
  '<section class="mlist"><h3>'+MONL[M.m]+" "+M.y+" · "+(evs.length?evs.length+" tournament"+(evs.length>1?"s":""):"nothing scheduled")+"</h3>"+(evs.length?evs.map(evRow).join(""):'<p class="empty" style="padding-top:12px">No MRX4 tournaments loaded for this month yet. They appear here as the circuits publish their calendars.</p>')+"</section>"+
  (tbc.length?'<section class="mlist"><h3>Date to be confirmed</h3>'+tbc.map(evRow).join("")+"</section>":"");
}
function renderPlayers(){
  view.innerHTML='<div class="lede"><div><h2>Players</h2><p>Each player’s circuits and the tournaments that follow from them. Provisional dates move when the official calendars come out.</p></div></div><div class="grid">'+
  S.players.map(function(p){
    var evs=eventsFor(p),cl=clashes(p),ids=clashIds(p);
    return'<section class="card"><div class="card-top"><h3>'+esc(p.name)+'</h3><span class="cc">'+esc(p.country)+'</span><span class="count">'+evs.length+" events</span></div>"+
    '<div class="chips">'+(p.circuits.length?p.circuits.map(circChip).join(""):'<span class="empty">No circuits marked yet</span>')+"</div>"+
    (cl.length?'<div class="warnbox">Overlap: '+cl.map(function(c){return esc(c[0].name)+" and "+esc(c[1].name)}).join("; ")+"</div>":"")+
    (evs.length?'<ul class="evlist">'+evs.map(function(e){return'<li><span class="dt">'+esc(range(e))+'</span><span class="nm"><span class="sw" style="--c:'+cvar(e.circuit)+'"></span><span>'+esc(e.name)+(ids[e.id]?" ⚠":"")+"</span></span>"+statusPill(e)+"</li>"}).join("")+"</ul>":'<p class="empty">No dated tournaments yet on this player’s circuits. They will appear here as calendars are published.</p>')+
    ((downloadsNs||STANDALONE)&&evs.length?'<button class="btn ghost" data-dl="'+esc(p.id)+'">Download calendar (.csv)</button>':"")+
    "</section>";
  }).join("")+"</div>";
}
function evRow(e){
    var who=S.players.filter(function(p){return plays(e,p)});
    var lineup="";
    if(canEdit){
      lineup='<details class="lineup"><summary>Edit lineup</summary><div class="lineup-grid">'+S.players.map(function(p){
        var o=ov(e.id,p.id),on=plays(e,p);
        return'<label><input type="checkbox" id="lu-'+esc(e.id)+"-"+esc(p.id)+'" data-lu="'+esc(e.id)+'" data-p="'+esc(p.id)+'"'+(on?" checked":"")+">"+esc(p.name)+(o?" <small>(manual)</small>":"")+"</label>";
      }).join("")+"</div></details>";
    }
    return'<div class="ev"><div class="dt">'+esc(range(e))+'</div><div class="title"><div class="row">'+circChip(e.circuit)+statusPill(e)+"</div><b>"+esc(e.name)+'</b><span class="where">'+esc([e.cat,e.city,e.country].filter(Boolean).join(" · "))+"</span>"+(e.note?'<span class="note">'+esc(e.note)+"</span>":"")+
    (e.source?'<a class="src" href="'+esc(e.source)+'" target="_blank" rel="noopener">Source ↗</a>':"")+
    '</div><div class="who"><span class="eyebrow">MRX4 players</span><div class="chips">'+(who.length?who.map(function(p){return'<span class="chip">'+esc(p.name)+"</span>"}).join(""):'<span class="empty">None</span>')+"</div>"+lineup+"</div></div>";
  }
function renderCircuits(){
  var head="<tr><th>Player</th>"+S.circuits.map(function(c){return'<th><span class="sw" style="--c:'+cvar(c.id)+'"></span>'+esc(c.name)+"</th>"}).join("")+"</tr>";
  var body=S.players.map(function(p){return"<tr><td>"+esc(p.name)+"</td>"+S.circuits.map(function(c){
    var on=p.circuits.indexOf(c.id)>-1;
    return"<td>"+(canEdit?'<input type="checkbox" id="mx-'+esc(p.id)+"-"+esc(c.id)+'" data-mx="'+esc(p.id)+'" data-c="'+esc(c.id)+'" aria-label="'+esc(p.name+" plays "+c.name)+'"'+(on?" checked":"")+">":on?'<span class="tick">●</span>':'<span class="dash">–</span>')+"</td>"}).join("")+"</tr>"}).join("");
  view.innerHTML='<div class="lede"><div><h2>Who plays what</h2><p>The circuits each player competes on. Tournaments on a marked circuit go into that player’s calendar automatically, except CUPRA FIP Tour events, which are added one by one when the player enters.</p></div></div>'+
  (canEdit?'<p class="editnote">You can edit this table. Tick or untick a circuit, then press “Save for everyone”.</p>':"")+
  '<div class="mx-wrap"><table class="mx"><thead>'+head+"</thead><tbody>"+body+"</tbody></table></div>"+
  '<h2 style="margin-top:12px">Circuit status</h2><div class="cgrid">'+S.circuits.map(function(c){
    var n=S.events.filter(function(e){return e.circuit===c.id}).length;
    return'<section class="ccard" style="--c:'+cvar(c.id)+'"><h3>'+esc(c.name)+'</h3><span class="eyebrow">'+esc(c.status)+" · "+n+" loaded</span><p>"+esc(c.note)+"</p>"+(c.url?'<a class="src" href="'+esc(c.url)+'" target="_blank" rel="noopener">Source ↗</a>':"")+"</section>";
  }).join("")+"</div>";
}
function renderNews(){
  var items=(S.news||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  view.innerHTML='<div class="lede"><div><h2>News</h2><p>Calendar announcements and player news, linked to the circuits and tournaments they affect.</p></div></div><div class="news">'+
  items.map(function(n){
    var d=n.date.split("-"),label=MON[+d[1]-1]+" "+d[0]+(d[2]?" · "+(+d[2]):"");
    var tags=(n.circuits||[]).map(circChip).join("")+(n.players||[]).map(function(id){var p=player(id);return p?'<span class="chip">'+esc(p.name)+"</span>":""}).join("");
    return'<article><time>'+esc(label)+'</time><div style="display:grid;gap:6px;min-width:0"><h3><a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.title)+' ↗</a></h3><span class="src">'+esc(n.source||"")+'</span><div class="chips">'+tags+"</div></div></article>";
  }).join("")+"</div>";
}
var RENDER={calendar:renderCalendar,players:renderPlayers,circuits:renderCircuits,news:renderNews};
function render(){
  document.getElementById("season-label").textContent=S.label||"";
  var u=t(S.updated);document.getElementById("meta").textContent="Updated "+(u?dmy(u,true):"");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",b.dataset.tab===tab?"true":"false")});
  RENDER[tab]();
  document.getElementById("savebar").hidden=!dirty;
}

/* ---------- interactions ---------- */
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;closeSheet();render();try{history.replaceState(null,"","#"+tab)}catch(_){}});
var sheet=document.getElementById("sheet");
function closeSheet(){sheet.hidden=true}
function openSheet(id){
  var ev=null;S.events.forEach(function(e){if(e.id===id)ev=e});if(!ev)return;
  var who=S.players.filter(function(p){return plays(ev,p)});
  sheet.style.setProperty("--c",cvar(ev.circuit));
  sheet.innerHTML='<button class="x" aria-label="Close" id="sheet-x">×</button><div class="wrap"><div class="chips">'+circChip(ev.circuit)+statusPill(ev)+'</div><h2>'+esc(ev.name)+'</h2><div class="eyebrow">'+esc(range(ev))+" · "+esc([ev.city,ev.country].filter(Boolean).join(", "))+"</div>"+
  (ev.note?'<p class="empty">'+esc(ev.note)+"</p>":"")+'<div class="chips">'+who.map(function(p){return'<span class="chip">'+esc(p.name)+"</span>"}).join("")+"</div>"+(ev.source?'<a class="src" href="'+esc(ev.source)+'" target="_blank" rel="noopener">Source ↗</a>':"")+"</div>";
  sheet.hidden=false;
}
view.addEventListener("click",function(e){
  var b=e.target.closest("[data-ev]");if(b){openSheet(b.dataset.ev);return}
  var d=e.target.closest("[data-dl]");if(d){downloadCsv(d.dataset.dl);return}
  var st=e.target.closest("[data-step]");if(st){month=Math.min(months().length-1,Math.max(0,month+(+st.dataset.step)));render();return}
  var mb=e.target.closest("[data-m]");if(mb){month=+mb.dataset.m;render();return}
  var pb=e.target.closest("[data-pf]");if(pb){pfilter=pb.dataset.pf;render();return}
  var ab=e.target.closest("[data-all]");if(ab){showAll=!showAll;render();return}
});
sheet.addEventListener("click",function(e){if(e.target.id==="sheet-x")closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
view.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.mx){
    var p=player(el.dataset.mx),c=el.dataset.c;
    p.circuits=p.circuits.filter(function(x){return x!==c});if(el.checked)p.circuits.push(c);
    p.circuits.sort(function(a,b){return S.circuits.findIndex(function(x){return x.id===a})-S.circuits.findIndex(function(x){return x.id===b})});
    markDirty();
  }else if(el.dataset.lu){
    var ev=el.dataset.lu,pl=player(el.dataset.p),evc=(S.events.filter(function(x){return x.id===ev})[0]||{}).circuit,autoOn=auto(evc)&&pl.circuits.indexOf(evc)>-1;
    S.overrides=S.overrides||{};S.overrides[ev]=S.overrides[ev]||{};
    if(el.checked===autoOn)delete S.overrides[ev][pl.id];else S.overrides[ev][pl.id]=el.checked?"in":"out";
    if(!Object.keys(S.overrides[ev]).length)delete S.overrides[ev];
    markDirty();
  }
});
function markDirty(){if(!saved)saved=JSON.stringify(S);dirty=true;document.getElementById("savebar").hidden=false}
var toastT;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},3600)}
document.getElementById("discard").addEventListener("click",function(){if(saved)S=JSON.parse(saved);saved=null;dirty=false;render();toast("Changes discarded")});
document.getElementById("copy").addEventListener("click",function(){
  var txt=JSON.stringify({players:S.players.map(function(p){return{id:p.id,circuits:p.circuits}}),overrides:S.overrides||{}});
  try{navigator.clipboard.writeText(txt).then(function(){toast("Changes copied. Paste them to Claude in the chat.")},function(){toast("Copy is blocked here")})}catch(_){toast("Copy is blocked here")}
});
document.getElementById("save").addEventListener("click",function(){
  if(!artifactNs){toast("Saving isn’t available in this view. Use “Copy changes”.");return}
  var btn=this;btn.disabled=true;
  var out=JSON.parse(JSON.stringify(S));var now=new Date();out.updated=now.toISOString().slice(0,10);
  artifactNs.publish({"data/calendar.json":JSON.stringify(out,null,1)}).then(function(){
    S=out;saved=null;dirty=false;btn.disabled=false;render();toast("Saved. Everyone now sees the updated calendar.");
  },function(err){
    btn.disabled=false;var c=err&&err.code;
    if(c==="conflict")toast("Someone saved first. The page is reloading with their version.");
    else if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"){toast("Saving isn’t available in this view. Use “Copy changes” and send them to Claude.")}
    else toast("Couldn’t save ("+(c||"error")+"). Try again in a moment.");
  });
});

/* ---------- calendar export ---------- */
function csvCell(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function us(ms){var d=new Date(ms);return(d.getUTCMonth()+1)+"/"+d.getUTCDate()+"/"+d.getUTCFullYear()}
function downloadCsv(pid){
  var p=player(pid);if(!p)return;
  var rows=[["Subject","Start Date","End Date","All Day Event","Location","Description"]];
  eventsFor(p).forEach(function(e){rows.push([e.name+(e.status!=="confirmed"?" (provisional)":""),us(t(e.start)),us(t(e.end||e.start)),"True",[e.city,e.country].filter(Boolean).join(", "),circ(e.circuit).name+" · "+(e.cat||"")+" · "+e.status])});
  var data=rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n");
  var fname="MRX4-"+p.name.replace(/\s+/g,"-")+"-"+(S.label||"").replace("–","-")+".csv";
  if(!downloadsNs){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("Saved. Import it into Google Calendar or Outlook.")}catch(_){toast("Download isn’t available here.")}return}
  downloadsNs.save({filename:"MRX4-"+p.name.replace(/\s+/g,"-")+"-"+(S.label||"").replace("–","-")+".csv",data:data}).then(function(){toast("Saved. Import it into Google Calendar or Outlook.")},function(err){if(err&&err.code!=="declined")toast("Download isn’t available here.")});
}

/* ---------- boot ---------- */
var h=(location.hash||"").slice(1);if(RENDER[h])tab=h;
(function(){var n=new Date(),MS=months();MS.forEach(function(X,i){if(X.y===n.getUTCFullYear()&&X.m===n.getUTCMonth())month=i})})();
render();
fetch("data/calendar.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(d&&d.events&&!dirty&&(!S.updated||d.updated>=S.updated)){S=d;render()}
}).catch(function(){});
if(window.claude&&window.claude.use){
  window.claude.use("downloads").then(function(ns){if(ns){downloadsNs=ns;if(tab==="players")render()}}).catch(function(){});
  window.claude.use("user").then(function(u){return u?u.canEdit():false}).then(function(ok){
    if(!ok)return;
    return window.claude.use("artifact").then(function(ns){artifactNs=ns;canEdit=true;if(!dirty)render()});
  }).catch(function(){});
}
})();
</script>

</body>
</html>
